<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
        }

        .header {
            background-color: #1f3c88;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1f3c88;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d68;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1f3c88;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="header">

        <h1>Student Registration Portal</h1>

        <p>Edit Student Details</p>

    </div>


    <div class="container">

        <h2>Edit Student</h2>

        <form
            action="/edit/{{ student[0] }}"
            method="POST">


            <div class="form-group">

                <label>Student Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ student[1] }}"
                    required>

            </div>


            <div class="form-group">

                <label>Register Number</label>

                <input
                    type="text"
                    name="register_number"
                    value="{{ student[2] }}"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student[3] }}"
                    required>

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ student[4] }}"
                    required>

            </div>


            <div class="form-group">

                <label>Course</label>

                <select name="course" required>

                    <option value="Computer Science"
                        {% if student[5] == "Computer Science" %}selected{% endif %}>
                        Computer Science
                    </option>

                    <option value="Computer Applications"
                        {% if student[5] == "Computer Applications" %}selected{% endif %}>
                        Computer Applications
                    </option>

                    <option value="Data Science"
                        {% if student[5] == "Data Science" %}selected{% endif %}>
                        Data Science
                    </option>

                    <option value="Artificial Intelligence"
                        {% if student[5] == "Artificial Intelligence" %}selected{% endif %}>
                        Artificial Intelligence
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Semester</label>

                <select name="semester" required>

                    {% for i in range(1, 9) %}

                    <option value="{{ i }}"
                        {% if student[6] == i|string %}selected{% endif %}>
                        Semester {{ i }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            {% if student[7] == "Male" %}checked{% endif %}
                            required>
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                            {% if student[7] == "Female" %}checked{% endif %}>
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                            {% if student[7] == "Other" %}checked{% endif %}>
                        Other
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    rows="4"
                    required>{{ student[8] }}</textarea>

            </div>


            <button type="submit">
                Update Student
            </button>

        </form>


        <a
            href="/students"
            class="back-button">

            ← Back to Students

        </a>

    </div>

</body>

</html>
